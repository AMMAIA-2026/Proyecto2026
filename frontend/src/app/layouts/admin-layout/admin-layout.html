<div class="admin-layout">

    <button
        class="menu-toggle"
        (click)="toggleSidebar()"
    >

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        
    </button>

    <aside 
        class="sidebar"
        [class.open]="isSidebarOpen"
    >

        <div class="sidebar-top">

            <div class="brand">

                <div class="brand-circle">
                    S
                </div>

                <div class="brand-text">
                    <h2>SangreYa</h2>
                    <span>Panel administrativo</span>
                </div>

            </div>

        </div>

        <nav class="sidebar-nav">

            <a
                routerLink="/admin/dashboard"
                routerLinkActive="active-link"
            >

                <span>Dashboard</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 13h8V3H3v10Zm10 8h8V11h-8v10Zm0-18v4h8V3h-8ZM3 21h8v-6H3v6Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>

            </a>

            <a
                routerLink="/admin/campanias"
                routerLinkActive="active-link"
            >

                <span>Campañas</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 11L22 2L13 21L11 13L3 11Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>

            </a>

            <a
                routerLink="/admin/usuarios"
                routerLinkActive="active-link"
            >

                <span>Usuarios</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" 
                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users-icon lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>

            </a>

            <a
                routerLink="/admin/contactos"
                routerLinkActive="active-link"
            >
                <span>Contactos</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                </svg>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <button 
                class="logout-btn"
                (click)="abrirModalLogout()"
            >
               
                Cerrar sesión
            </button>

        </div>

    </aside>

    <main class="admin-content">
        <router-outlet></router-outlet>
    </main>

    @if (mostrarModalLogout) {

        <div class="logout-modal-overlay">

            <div class="logout-modal">

                <h3>Cerrar sesión</h3>
                <p>¿Estás seguro de que deseas cerrar sesión?</p>

                <div class="logout-modal-actions">

                    <button 
                        class="cancel-btn"
                        (click)="cancelarLogout()"
                    >
                        Cancelar
                    </button>

                    <button 
                        class="confirm-btn"
                        (click)="confirmarLogout()"
                    >
                        Sí, cerrar sesión
                    </button>

                </div>

            </div>

        </div>

    }

</div>
